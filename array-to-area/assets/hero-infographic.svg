<svg viewBox="0 0 720 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
  <title>从方阵到面积——乘法与几何的奇妙联结</title>

  <!-- 标题 -->
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#eef6ff">从方阵到面积 —— 乘法与几何的奇妙联结</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9fb4cc">每行人数 × 行数 = 总面积 —— 一个"方阵"打通乘法和面积</text>

  <!-- ===== 左边：方阵（乘法） ===== -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="200" height="140" rx="14" fill="#14233a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="100" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f59e0b" font-weight="600">方阵 · 乘法</text>
    <!-- 5×4 小人方阵 -->
    <g transform="translate(40,42)">
      <rect x="0" y="0" width="120" height="88" rx="3" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.2)" stroke-width="0.5"/>
      <!-- Row 1 -->
      <circle cx="16" cy="16" r="4" fill="#f59e0b"/><circle cx="40" cy="16" r="4" fill="#f59e0b"/><circle cx="64" cy="16" r="4" fill="#f59e0b"/><circle cx="88" cy="16" r="4" fill="#f59e0b"/><circle cx="112" cy="16" r="4" fill="#f59e0b"/>
      <!-- Row 2 -->
      <circle cx="16" cy="40" r="4" fill="#f59e0b"/><circle cx="40" cy="40" r="4" fill="#f59e0b"/><circle cx="64" cy="40" r="4" fill="#f59e0b"/><circle cx="88" cy="40" r="4" fill="#f59e0b"/><circle cx="112" cy="40" r="4" fill="#f59e0b"/>
      <!-- Row 3 -->
      <circle cx="16" cy="64" r="4" fill="#f59e0b"/><circle cx="40" cy="64" r="4" fill="#f59e0b"/><circle cx="64" cy="64" r="4" fill="#f59e0b"/><circle cx="88" cy="64" r="4" fill="#f59e0b"/><circle cx="112" cy="64" r="4" fill="#f59e0b"/>
    </g>
    <text x="100" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#eef6ff" font-weight="600">每行 5 人 × 3 行 = 15 人</text>
    <text x="100" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9fb4cc">5 × 3 = 15</text>
  </g>

  <!-- 箭头① -->
  <line x1="225" y1="140" x2="268" y2="140" stroke="#22c55e" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="246" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#22c55e" font-weight="600">类比</text>
  <text x="246" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9fb4cc">每个人→1格</text>

  <!-- ===== 中间：桥接 ===== -->
  <g transform="translate(275,85)">
    <rect x="0" y="0" width="100" height="110" rx="10" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.2)" stroke-width="0.6" stroke-dasharray="4 3"/>
    <text x="50" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#22c55e" font-weight="600">类比桥</text>
    <text x="50" y="45" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#eef6ff">每行人数</text>
    <text x="50" y="62" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#eef6ff" font-weight="600">= 长</text>
    <text x="50" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#eef6ff">行数</text>
    <text x="50" y="99" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#eef6ff" font-weight="600">= 宽</text>
  </g>

  <!-- ===== 右边：面积（几何） ===== -->
  <g transform="translate(380,70)">
    <rect x="0" y="0" width="200" height="140" rx="14" fill="#14233a" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="100" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a78bfa" font-weight="600">面积 · 几何</text>
    <!-- 5×3 方格 -->
    <g transform="translate(40,42)">
      <rect x="0" y="0" width="120" height="72" rx="0" fill="rgba(167,139,250,0.12)" stroke="#a78bfa" stroke-width="1.2"/>
      <line x1="24" y1="0" x2="24" y2="72" stroke="#a78bfa" stroke-width="0.5"/>
      <line x1="48" y1="0" x2="48" y2="72" stroke="#a78bfa" stroke-width="0.5"/>
      <line x1="72" y1="0" x2="72" y2="72" stroke="#a78bfa" stroke-width="0.5"/>
      <line x1="96" y1="0" x2="96" y2="72" stroke="#a78bfa" stroke-width="0.5"/>
      <line x1="0" y1="24" x2="120" y2="24" stroke="#a78bfa" stroke-width="0.5"/>
      <line x1="0" y1="48" x2="120" y2="48" stroke="#a78bfa" stroke-width="0.5"/>
    </g>
    <text x="100" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#eef6ff" font-weight="600">长 5 × 宽 3 = 面积 15</text>
    <text x="100" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9fb4cc">5cm × 3cm = 15cm²</text>
  </g>

  <!-- 底部标签 -->
  <rect x="60" y="230" width="160" height="30" rx="8" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.2)" stroke-width="0.6"/>
  <text x="140" y="249" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f59e0b" font-weight="600">乘法：数有几个"人"</text>

  <rect x="260" y="230" width="200" height="30" rx="8" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.2)" stroke-width="0.6"/>
  <text x="360" y="249" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#22c55e" font-weight="600">类比：长=每行人数，宽=行数</text>

  <rect x="500" y="230" width="160" height="30" rx="8" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.2)" stroke-width="0.6"/>
  <text x="580" y="249" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a78bfa" font-weight="600">面积：数有几个"格"</text>

  <!-- 核心问题 -->
  <rect x="60" y="278" width="600" height="34" rx="10" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.2)" stroke-width="0.6"/>
  <text x="360" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#bae6fd">核心发现：乘法算总面积 —— 长 × 宽 = 面积，跟"每行几人×几行"完全一样！</text>
</svg>
