<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#101d32"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" rx="18"/>

  <!-- Title -->
  <text x="480" y="52" text-anchor="middle" fill="#eef6ff" font-family="PingFang SC, sans-serif" font-size="28" font-weight="800">长方形和正方形的周长 · 知识地图</text>
  <line x1="160" y1="68" x2="800" y2="68" stroke="url(#brandGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Node 1: 认识长方形/正方形 -->
  <rect x="60" y="100" width="200" height="80" rx="14" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <text x="160" y="132" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">📐 前置基础</text>
  <text x="160" y="156" text-anchor="middle" fill="#eef6ff" font-size="15" font-weight="700">认识长方形与正方形</text>
  <text x="160" y="172" text-anchor="middle" fill="#9fb4cc" font-size="11">4条边、4个直角</text>

  <!-- Node 2: 周长概念 -->
  <rect x="380" y="100" width="200" height="80" rx="14" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.3)" stroke-width="1.5"/>
  <text x="480" y="132" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">🔍 核心概念</text>
  <text x="480" y="156" text-anchor="middle" fill="#eef6ff" font-size="15" font-weight="700">什么是周长？</text>
  <text x="480" y="172" text-anchor="middle" fill="#9fb4cc" font-size="11">封闭图形一周的长度</text>

  <!-- Node 3: 公式推导 -->
  <rect x="700" y="100" width="200" height="80" rx="14" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
  <text x="800" y="132" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">🧪 探究发现</text>
  <text x="800" y="156" text-anchor="middle" fill="#eef6ff" font-size="15" font-weight="700">周长公式推导</text>
  <text x="800" y="172" text-anchor="middle" fill="#9fb4cc" font-size="11">C长=2×(a+b) · C正=4a</text>

  <!-- Arrows connecting nodes -->
  <line x1="260" y1="140" x2="376" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.6"/>
  <line x1="580" y1="140" x2="696" y2="140" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)" opacity="0.6"/>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Application Section -->
  <rect x="220" y="240" width="520" height="72" rx="14" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>
  <text x="480" y="272" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="600">⚡ 应用迁移</text>
  <text x="480" y="296" text-anchor="middle" fill="#eef6ff" font-size="14">篱笆围栏 · 操场跑道 · 相框边框 · 桌布花边</text>

  <!-- Arrow from formula to application -->
  <line x1="480" y1="180" x2="480" y2="236" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowYellow)" opacity="0.6"/>
  <defs>
    <marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Bottom: Rectangle & Square visual comparison -->
  <rect x="120" y="360" width="300" height="150" rx="12" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
  <text x="270" y="390" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="700">长方形</text>
  <rect x="140" y="405" width="260" height="80" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="150" y="435" fill="#9fb4cc" font-size="11">长 a</text>
  <text x="375" y="480" fill="#9fb4cc" font-size="11">宽 b</text>
  <text x="240" y="500" fill="#eef6ff" font-size="12" font-weight="600">C = 2 × (a + b)</text>

  <rect x="540" y="360" width="300" height="150" rx="12" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>
  <text x="690" y="390" text-anchor="middle" fill="#a78bfa" font-size="16" font-weight="700">正方形</text>
  <rect x="590" y="405" width="120" height="80" rx="4" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="585" y="460" fill="#9fb4cc" font-size="11">边长 a</text>
  <text x="660" y="500" fill="#eef6ff" font-size="12" font-weight="600">C = 4 × a</text>

  <!-- Footer -->
  <text x="480" y="530" text-anchor="middle" fill="#64748b" font-size="11">TeachAny · 小学数学 · 三年级 · 探究课</text>
</svg>
